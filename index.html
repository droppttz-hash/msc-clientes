<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d4ed8">
  <title>Gestão</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d4ed8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="tela-login" class="tela-cheia" hidden>
    <form id="form-login" class="login-card" autocomplete="on">
      <div class="login-marca"><span class="logo-quadro" id="login-logo"></span><div><h1 id="login-nome">Gestão</h1><p class="muted">Entre com seu usuário</p></div></div>
      <label>E-mail <input type="email" name="email" required autocomplete="username"></label>
      <label>Senha <input type="password" name="senha" required autocomplete="current-password"></label>
      <p class="erro" id="login-erro" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </section>

  <!-- SEM CONFIGURAÇÃO / SEM ACESSO -->
  <section id="tela-aviso" class="tela-cheia" hidden>
    <div class="login-card">
      <h1 id="aviso-titulo"></h1>
      <p class="muted" id="aviso-texto"></p>
      <button class="btn btn-ghost btn-block" id="btn-sair-aviso" type="button" hidden>Sair</button>
    </div>
  </section>

  <!-- APLICATIVO -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Menu">
      <div class="sidebar-topo">
        <a href="#/inicio" class="marca"><span class="logo-quadro" id="marca-logo"></span><span class="marca-nome" id="marca-nome"></span></a>
        <button class="icone-btn so-desktop" id="btn-recolher" type="button" aria-label="Recolher menu" title="Recolher menu"></button>
      </div>
      <nav id="menu" class="menu"></nav>
      <div class="sidebar-rodape">
        <button class="usuario" id="btn-usuario" type="button">
          <span class="avatar" id="usuario-avatar"></span>
          <span class="usuario-txt"><b id="usuario-nome"></b><small id="usuario-cargo"></small></span>
        </button>
      </div>
    </aside>
    <div class="fundo-menu" id="fundo-menu" hidden></div>

    <div class="principal">
      <header class="topbar">
        <button class="icone-btn so-mobile" id="btn-menu" type="button" aria-label="Abrir menu"></button>
        <div class="novo-wrap">
          <button class="btn btn-primary" id="btn-novo" type="button" aria-haspopup="menu"></button>
          <div class="dropdown" id="menu-novo" role="menu" hidden></div>
        </div>
        <button class="busca-gatilho" id="btn-busca" type="button">
          <span id="busca-ico"></span><span class="busca-txt">Buscar cliente, produto, IMEI, venda…</span><kbd class="so-desktop">Ctrl K</kbd>
        </button>
        <div class="topbar-dir">
          <button class="icone-btn" id="btn-avisos" type="button" aria-label="Avisos" title="Avisos"><span id="avisos-ico"></span><span class="badge" id="avisos-badge" hidden></span></button>
          <div class="dropdown dropdown-dir" id="menu-avisos" hidden></div>
          <button class="icone-btn" id="btn-tema" type="button" aria-label="Alternar claro/escuro" title="Claro / escuro"></button>
        </div>
      </header>
      <main id="conteudo" class="conteudo" tabindex="-1"></main>
    </div>

    <nav class="barra-inferior so-mobile" id="barra-inferior" aria-label="Atalhos"></nav>
  </div>

  <!-- BUSCA GERAL -->
  <dialog id="dlg-busca" class="modal modal-busca">
    <div class="busca-caixa">
      <span id="busca-ico2"></span>
      <input id="busca-input" type="search" placeholder="Digite nome, telefone, SKU, IMEI ou nº da venda…" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div id="busca-resultados" class="busca-resultados"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="dica" class="dica-grafico" role="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
